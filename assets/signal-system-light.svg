<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Signal to System</title>
  <desc id="desc">A technical notebook diagram connecting silicon, speech, vision, and trust through an evaluated AI systems pipeline.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d9ddd7" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" x2="1">
      <stop stop-color="#2448a4"/>
      <stop offset="1" stop-color="#e56b28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="#f5f6f1"/>
  <rect x="1" y="1" width="1198" height="298" rx="27" fill="url(#grid)" stroke="#c8cec6"/>

  <g fill="none" stroke="#2448a4" stroke-width="2">
    <circle cx="132" cy="150" r="82"/>
    <circle cx="132" cy="150" r="58" opacity=".55"/>
    <path d="M50 150h164M132 68v164" opacity=".35"/>
    <circle cx="108" cy="126" r="8" fill="#2448a4"/>
    <circle cx="156" cy="102" r="8" fill="#e56b28" stroke="none"/>
    <circle cx="156" cy="174" r="8" fill="#2448a4"/>
    <circle cx="108" cy="198" r="8" fill="#e56b28" stroke="none"/>
  </g>

  <path d="M250 150h55l17-34 27 70 25-52 22 31 26-15h82" fill="none" stroke="url(#trace)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="504" cy="150" r="6" fill="#e56b28"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">
    <text x="58" y="270" font-size="15" letter-spacing="3">SILICON</text>
    <text x="292" y="270" font-size="15" letter-spacing="3">SPEECH</text>
    <text x="527" y="270" font-size="15" letter-spacing="3">VISION</text>
    <text x="997" y="270" font-size="15" letter-spacing="3">TRUST</text>
  </g>

  <g transform="translate(520 70)">
    <rect width="390" height="160" rx="20" fill="#ffffff" stroke="#9ca8bc" stroke-width="2"/>
    <text x="28" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3" fill="#58657a">SIGNAL → SYSTEM</text>
    <text x="28" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700" fill="#111827">Mechanism. Evidence. Use.</text>
    <path d="M28 112h78M128 112h78M228 112h78M328 112h34" stroke="#e56b28" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#58657a">build → evaluate → inspect → deploy</text>
  </g>

  <g fill="none" stroke="#2448a4" stroke-width="2">
    <path d="M932 95h66l18 22h70"/>
    <path d="M932 150h92l18-18h74"/>
    <path d="M932 205h52l18-24h102"/>
    <circle cx="998" cy="95" r="5" fill="#2448a4"/>
    <circle cx="1024" cy="150" r="5" fill="#e56b28" stroke="none"/>
    <circle cx="984" cy="205" r="5" fill="#2448a4"/>
  </g>
</svg>
