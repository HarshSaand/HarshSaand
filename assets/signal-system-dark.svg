<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Harsh Saand, signal to system</title>
  <desc id="desc">An animated technical map connects semiconductor intelligence, speech, vision, and trustworthy evaluation.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a15"/><stop offset="1" stop-color="#15231b"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55c993" stop-opacity="0"/><stop offset=".5" stop-color="#55c993"/><stop offset="1" stop-color="#55c993" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26372c" stroke-width="1"/></pattern>
    <clipPath id="panelClip"><rect x="1" y="1" width="1398" height="518" rx="26"/></clipPath><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .route{stroke-dasharray:10 12;animation:route 3.8s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}.p2{animation-delay:.65s}.p3{animation-delay:1.3s}.p4{animation-delay:1.95s}.scan{animation:scan 5.8s cubic-bezier(.45,0,.55,1) infinite}.wave{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 4.8s cubic-bezier(.22,1,.36,1) infinite}.label{animation:label 8s ease-in-out infinite}.l2{animation-delay:2s}.l3{animation-delay:4s}.l4{animation-delay:6s}
      @keyframes route{to{stroke-dashoffset:-44}}@keyframes pulse{0%,100%{transform:scale(.82);opacity:.45}45%{transform:scale(1.18);opacity:1}}@keyframes scan{0%,12%{transform:translateX(-210px);opacity:0}24%,76%{opacity:.2}88%,100%{transform:translateX(1230px);opacity:0}}@keyframes draw{0%{stroke-dashoffset:420;opacity:.25}38%,78%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-420;opacity:.25}}@keyframes label{0%,19%,100%{opacity:.38}4%,14%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.route,.pulse,.scan,.wave,.label{animation:none!important}.label{opacity:1}.scan{display:none}.wave{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1400" height="520" rx="27" fill="url(#surface)"/><rect x="1" y="1" width="1398" height="518" rx="26" fill="url(#grid)" stroke="#32483a" stroke-width="2"/>
  <g clip-path="url(#panelClip)"><rect class="scan" x="-170" y="0" width="180" height="520" fill="url(#fade)" filter="url(#soft)"/></g>
  <g transform="translate(72 76)">
    <text class="mono" x="2" y="18" font-size="16" letter-spacing="3" fill="#55c993">AI SYSTEMS ENGINEER</text>
    <text class="sans" x="0" y="100" font-size="76" font-weight="750" letter-spacing="-3" fill="#edf7f0">HARSH</text><text class="sans" x="0" y="172" font-size="76" font-weight="750" letter-spacing="-3" fill="#edf7f0">SAAND</text>
    <text class="sans" x="2" y="220" font-size="22" fill="#aabbb0">I turn difficult signals into systems</text><text class="sans" x="2" y="250" font-size="22" fill="#aabbb0">people can inspect, test, and use.</text>
  </g>
  <g transform="translate(72 382)">
    <path d="M0 30h34l13-24 21 48 20-35 17 23 19-12h62" fill="none" stroke="#55c993" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="wave" d="M0 30h34l13-24 21 48 20-35 17 23 19-12h62" fill="none" stroke="#15231b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono" x="216" y="36" font-size="16" letter-spacing="2" fill="#aabbb0">MECHANISM  →  EVIDENCE  →  USE</text>
  </g>
  <g transform="translate(670 60)">
    <path d="M300 198C206 198 190 85 76 85M300 198C214 198 213 305 72 305M300 198C405 198 410 82 552 82M300 198C401 198 418 311 568 311" fill="none" stroke="#3c5847" stroke-width="2"/>
    <path class="route" d="M300 198C206 198 190 85 76 85M300 198C214 198 213 305 72 305M300 198C405 198 410 82 552 82M300 198C401 198 418 311 568 311" fill="none" stroke="#55c993" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(300 198)"><circle r="76" fill="#111a15" stroke="#55c993" stroke-width="2.5"/><circle r="56" fill="none" stroke="#3c5847" stroke-width="1.5" stroke-dasharray="4 7"/><circle class="pulse" r="10" fill="#55c993"/><text class="mono" x="0" y="108" text-anchor="middle" font-size="15" letter-spacing="2" fill="#edf7f0">SIGNAL → SYSTEM</text></g>
    <g transform="translate(76 85)"><circle class="pulse" r="50" fill="#15231b" stroke="#55c993" stroke-width="2"/><circle r="30" fill="none" stroke="#64806e"/><path d="M-50 0h100M0-50v100" stroke="#64806e" opacity=".7"/><circle cx="-15" cy="-15" r="5" fill="#55c993"/><circle cx="15" cy="15" r="5" fill="#55c993"/><text class="mono label" x="0" y="76" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#edf7f0">SEMICONDUCTORS</text></g>
    <g transform="translate(72 305)"><circle class="pulse p2" r="50" fill="#15231b" stroke="#55c993" stroke-width="2"/><path d="M-30 0h10l8-22 12 44 12-35 9 20 10-7" fill="none" stroke="#55c993" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="mono label l2" x="0" y="76" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#edf7f0">SPEECH + NLP</text></g>
    <g transform="translate(552 82)"><circle class="pulse p3" r="50" fill="#15231b" stroke="#55c993" stroke-width="2"/><path d="M-30 0c17-24 43-24 60 0-17 24-43 24-60 0Z" fill="none" stroke="#55c993" stroke-width="2.5"/><circle r="9" fill="#55c993"/><text class="mono label l3" x="0" y="76" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#edf7f0">VISION</text></g>
    <g transform="translate(568 311)"><circle class="pulse p4" r="50" fill="#15231b" stroke="#55c993" stroke-width="2"/><path d="M0-29 24-18v18c0 17-10 28-24 35C-14 28-24 17-24 0v-18Z" fill="none" stroke="#55c993" stroke-width="2.5"/><path d="m-10 1 7 7 15-17" fill="none" stroke="#55c993" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="mono label l4" x="0" y="76" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#edf7f0">EVALUATION + TRUST</text></g>
  </g>
</svg>
